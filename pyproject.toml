[project]
name = "titans-mag-gpt2"
version = "0.1.0"
description = "From-scratch PyTorch implementation of the TITANS MAG variant on GPT-2."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mason Flint" },
]
dependencies = [
    "torch>=2.3,<3",
    "tiktoken>=0.5",
    "transformers>=4.30",
    "datasets>=2.14",
    "numpy>=1.24",
    "tqdm>=4.66",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# G278 — 8-bit AdamW optimizer state via bitsandbytes. Optional; falls
# back to torch.optim.AdamW when not installed (--optim8bit flag fails
# loud with an install hint).
optim8bit = ["bitsandbytes>=0.43"]

# Gram Newton-Schulz polar decomposition (Tri Dao). Drop-in replacement
# for stock NS5 that does 2 rectangular matmuls + T iterations on the
# small Gram matrix instead of 2T rectangular matmuls. Targets Hopper
# (H100) / Blackwell (B100/B200/B300) GPUs and requires PyTorch 2.7+ /
# CUDA 12.9+. Empirically measured 1.17-3.07× speedup at gpt2_small
# dims on consumer Blackwell (sm_120). Convergence quality comparable
# to stock NS5 with Muon coefficients. Install via the `gram_ns5` extra
# when the --nmm-use-gram-ns5 flag is set.
gram_ns5 = ["gram-newton-schulz>=0.1.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "data", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: CPU test taking >5s but <60s",
    "gpu: requires CUDA",
    "slow_gpu: GPU test taking >60s",
    "ddp: requires >=2 GPUs and torchrun",
    "compile: requires torch.compile",
    "perf: performance gate with deterministic threshold",
]
